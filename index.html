<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax WebSite</title>
  
  <!-- Preload critical fonts -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;800&display=swap" as="style">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;800&display=swap">
  
  <!-- Preload critical CSS -->
  <link rel="preload" href="css/style.css" as="style">
  <link rel="stylesheet" href="css/style.css" class="css">
  
  <!-- Preload critical JS -->
  <link rel="preload" href="js/gsap.min.js" as="script">
  
  <!-- Preload critical images -->
  <link rel="preload" href="img/background.webp" as="image">
  <link rel="preload" href="img/mountain_1.webp" as="image">
  <link rel="preload" href="img/mountain_2.webp" as="image">
  <link rel="preload" href="img/syndi.webp" as="image">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <!-- Header with logo and navigation -->
  <header class="hide">
    <nav>
      <img src="img/syndi.webp" alt="Syndicate" class="logo" />
      <ul>
        <li>
          <a href="#">Login</a>
        </li>
        <li>
          <a href="#">Signup</a>
        </li>
        <li class="search">
          <a href="#"><i class="fa-solid fa-magnifying-glass"></i>
          </a>
        </li>
        <li class="hamburger">
          <a href="#"><div class="bar"></div>
          </a>
        </li>
      </ul>
    </nav>
  </header>
  
  <!-- Main content with parallax elements -->
  <main>
    <div class="vignette hide"></div>
    <img src="img/background.webp" data-speedx="0.3" data-speedy="0.38" data-speedz="0" data-rotation="0" data-distance="-200" class="parallax bg-img">
    <img src="img/fog_7.webp" data-speedx="0.27" data-speedy="0.32" data-speedz="0" data-rotation="0" data-distance="850" class="parallax fog-7">
    <img src="img/mountain_10.webp" data-speedx="0.195" data-speedy="0.305" data-speedz="0" data-rotation="0" data-distance="2000" class="parallax mountain-10">
    <img src="img/fog_6.webp" data-speedx="0.25" data-speedy="0.28" data-speedz="0" data-rotation="0" data-distance="1400" class="parallax fog-6">
    <img src="img/mountain_9.webp" data-speedx="0.125" data-speedy="0.155" data-speedz="0.5" data-rotation="0.2" data-distance="1700" class="parallax mountain-9">
    <img src="img/mountain_8.webp" data-speedx="0.1" data-speedy="0.11" data-speedz="0" data-rotation="0.02" data-distance="1800" class="parallax mountain-8">
    <img src="img/fog_5.webp" data-speedx="0.16" data-speedy="0.105" data-speedz="0" data-rotation="0" data-distance="1900" class="parallax fog-5">
    <img src="img/mountain_7.webp" data-speedx="0.1" data-speedy="0.1" data-speedz="0" data-rotation="0.09" data-distance="2000" class="parallax mountain-7">
    <div class="text parallax" data-speedx="0.07" data-speedy="0.07" data-speedz="0" data-rotation="0.11" data-distance="0">
      <h2>Classic</h2>
      <h1><span class="gradient-text">Homoepathy</span></h1>
    </div>
    <img src="img/mountain_6.webp" data-speedx="0.065" data-speedy="0.05" data-speedz="0.05" data-rotation="0.12" data-distance="2300" class="parallax mountain-6">
    <img src="img/fog_4.webp" data-speedx="0.135" data-speedy="0.32" data-speedz="0" data-rotation="0" data-distance="2400" class="parallax fog-4">
    <img src="img/mountain_5.webp" data-speedx="0.08" data-speedy="0.08" data-speedz="0.13" data-rotation="0.1" data-distance="2550" class="parallax mountain-5">
    <img src="img/fog_3.webp" data-speedx="0.11" data-speedy="0.018" data-speedz="0" data-rotation="0" data-distance="2800" class="parallax fog-3">
    <img src="img/mountain_4.webp" data-speedx="0.059" data-speedy="0.024" data-speedz="0.35" data-rotation="0.15" data-distance="3200" class="parallax mountain-4">
    <img src="img/mountain_3.webp" data-speedx="0.04" data-speedy="0.018" data-speedz="0.32" data-rotation="0.05" data-distance="3400" class="parallax mountain-3">
    <img src="img/fog_2.webp" data-speedx="0.15" data-speedy="0.0115" data-speedz="0" data-rotation="0" data-distance="3600" class="parallax fog-2">
    <img src="img/mountain_2.webp" data-speedx="0.0235" data-speedy="0.013" data-speedz="0.42" data-rotation="0.15" data-distance="3800" class="parallax mountain-2">
    <img src="img/mountain_1.webp" data-speedx="0.027" data-speedy="0.018" data-speedz="0.53" data-rotation="0.2" data-distance="4000" class="parallax mountain-1">
    <img src="img/sun_rays.webp" class="sun-rays hide">
    <img src="img/black_shadow.webp" class="black-shadow hide">
    <img src="img/fog_1.webp" data-speedx="0.12" data-speedy="0.01" data-speedz="0" data-rotation="0" class="parallax fog-1">
  </main>

  <!-- Scripts -->
  <script src="js/gsap.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
